# Xcode プロジェクトの定義です。`xcodegen` で VJCocteau.xcodeproj を生成します(生成物はコミットしません)。
name: VJCocteau
options:
  bundleIdPrefix: com.vjcocteau
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  VJCocteau:
    type: application
    platform: macOS
    sources:
      - path: VJCocteau
        excludes: [Shaders, Effects, Info.plist, VJCocteau.entitlements, Resources]
      # Shader と Effect は、実行時にソースを読んでコンパイルするので、フォルダのまま Resources へ入れます。
      - path: VJCocteau/Shaders
        type: folder
        buildPhase: resources
      - path: VJCocteau/Effects
        type: folder
        buildPhase: resources
      - path: VJCocteau/Resources/AppIcon.icns
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: VJ Cocteau
        PRODUCT_BUNDLE_IDENTIFIER: com.vjcocteau.app
        INFOPLIST_FILE: VJCocteau/Info.plist
        CODE_SIGN_ENTITLEMENTS: VJCocteau/VJCocteau.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
